name: Build and Deploy Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  COMPOSE_SERVICE: admin

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Pull image and restart service on EC2
        env:
          EC2_COMPOSE_DIR: ${{ secrets.EC2_COMPOSE_DIR }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          COMPOSE_SERVICE: ${{ env.COMPOSE_SERVICE }}
        run: |
          COMMAND=$(cat <<EOF
          set -euo pipefail
          cd "$EC2_COMPOSE_DIR"
          if [ -n "$GHCR_READ_TOKEN" ]; then
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          docker compose pull "$COMPOSE_SERVICE"
          docker compose up -d redis
          docker compose run --rm "$COMPOSE_SERVICE" npx prisma migrate deploy
          docker compose up -d "$COMPOSE_SERVICE"
          docker image prune -f
          EOF
          )
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $COMPOSE_SERVICE from GHCR" \
            --parameters "commands=[$(printf '%s' "$COMMAND" | jq -Rs .)]" \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
