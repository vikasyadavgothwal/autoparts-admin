name: Build and Deploy Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  COMPOSE_SERVICE: admin

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # CI only: production DATABASE_URL stays on EC2. Next build imports DB-backed
      # route modules during page-data collection and requires this variable to exist.
      DATABASE_URL: postgresql://autoparts:autoparts@localhost:5432/autoparts?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            DATABASE_URL=postgresql://autoparts:autoparts@localhost:5432/autoparts?schema=public
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install EC2 SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/autoparts_ec2
          chmod 600 ~/.ssh/autoparts_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull image and restart service on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_COMPOSE_DIR: ${{ secrets.EC2_COMPOSE_DIR }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          COMPOSE_SERVICE: ${{ env.COMPOSE_SERVICE }}
        run: |
          set -euo pipefail
          : "${EC2_USER:=ubuntu}"
          test -n "$EC2_HOST"
          test -n "$EC2_COMPOSE_DIR"
          ssh -i ~/.ssh/autoparts_ec2 "$EC2_USER@$EC2_HOST" \
            "EC2_COMPOSE_DIR='$EC2_COMPOSE_DIR' GHCR_READ_TOKEN='$GHCR_READ_TOKEN' GHCR_USER='$GHCR_USER' COMPOSE_SERVICE='$COMPOSE_SERVICE' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd "$EC2_COMPOSE_DIR"
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          flock /tmp/autoparts-deploy.lock /opt/autoparts/deploy-service.sh "$COMPOSE_SERVICE"
          REMOTE_DEPLOY
